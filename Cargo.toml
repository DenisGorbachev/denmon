[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
homepage = "https://github.com/DenisGorbachev/denmon"
repository = "https://github.com/DenisGorbachev/denmon"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[workspace.metadata.details]
name = "denmon"
title = ""
readme = { generate = false }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "denmon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = ""

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.11", features = ["derive", "env"] }
derive_more = { version = "2.0.1", features = ["full"] }
errgonomic = "0.5.3"
fmt-derive = "0.1.2"
ntfy = { version = "0.8.0" }
numfmt = "1.2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "gzip", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1.39.2", features = ["macros", "fs", "net", "rt", "rt-multi-thread"] }
url = "2.5.7"
url-macro = "0.2.0"

[package.metadata.cargo-machete]
ignored = [
    "derive_more",
    "fmt-derive",
    "url"
]
