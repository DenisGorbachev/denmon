[package]
name = "denmon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = ""
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/DenisGorbachev/denmon"
repository = "https://github.com/DenisGorbachev/denmon"
readme = "README.md"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "lefthook.yml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[package.metadata.details]
title = ""
tagline = ""
summary = ""
announcement = ""
readme = { generate = false }

[dependencies]
clap = { version = "4.5.11", features = ["derive", "env"] }
derive_more = { version = "2.0.1", features = ["full"] }
errgonomic = "0.5.1"
fmt-derive = "0.1.2"
ntfy = { version = "0.8.0" }
numfmt = "1.2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "gzip", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1.39.2", features = ["macros", "fs", "net", "rt", "rt-multi-thread"] }
url = "2.5.7"
url-macro = "0.2.0"

[package.metadata.cargo-machete]
ignored = [
    "derive_more",
    "fmt-derive",
    "url"
]
